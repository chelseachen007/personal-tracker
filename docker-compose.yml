version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - ./database:/app/database
      - ./backend/prisma:/app/prisma
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production}
      # SSO 服务地址（修改为实际部署的 SSO 地址）
      - SSO_SERVER_URL=${SSO_SERVER_URL:-http://localhost:3002}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/docs"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NUXT_PUBLIC_API_BASE_URL=${API_BASE_URL:-http://localhost:3001}
        # SSO 服务地址（前端可访问的地址）
        - NUXT_PUBLIC_SSO_SERVER_URL=${SSO_SERVER_URL:-http://localhost:3002}
    ports:
      - "7003:3000"
    environment:
      - NUXT_PUBLIC_API_BASE_URL=${API_BASE_URL:-http://localhost:3001}
      - NUXT_PUBLIC_SSO_SERVER_URL=${SSO_SERVER_URL:-http://localhost:3002}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  database:
