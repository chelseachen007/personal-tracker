version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - ./database:/app/database
      - ./backend/prisma:/app/prisma
    environment:
      - NODE_ENV=production
      - JWT_SECRET=your-secret-key-change-in-production
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NUXT_PUBLIC_API_BASE_URL=http://localhost:3001
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  database:
